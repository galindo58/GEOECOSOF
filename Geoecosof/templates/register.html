<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoecosof - Registro</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Boxicons (Icons) -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: transparent;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 3rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .login-logo {
            height: 80px;
            margin-bottom: 1.5rem;
        }
        .login-title {
            margin-bottom: 2rem;
            color: var(--color-primary);
        }
        .login-card form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            text-align: left;
        }
        .flash-messages {
            list-style: none;
            padding: 0;
            margin-bottom: 1.5rem;
        }
        .flash-messages li {
            padding: 0.75rem;
            border-radius: var(--radius-md);
            background-color: #ffebee;
            color: var(--color-error);
            border: 1px solid #ffcdd2;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <video autoplay muted loop id="bg-video" style="position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -1; object-fit: cover;">
        <source src="{{ url_for('static', filename='videos/fondo.mp4') }}" type="video/mp4">
    </video>
    
    <!-- Logo over the watermark -->
    <img src="{{ url_for('static', filename='img/logo.png') }}" style="position: fixed; bottom: 40px; right: 40px; width: 80px; height: auto; z-index: 0; opacity: 0.9; pointer-events: none;" alt="Geoecosof">

    <div class="login-card">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Geoecosof Logo" class="login-logo">
        <h2 class="login-title">Crear una Cuenta</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <ul class="flash-messages">
            {% for category, message in messages %}
              <li class="{{ category }}">{{ message }}</li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required placeholder="Elige un usuario">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="Elige una contraseña">
            </div>
            <button type="submit" class="btn-primary w-100">Registrarse <i class='bx bx-user-plus'></i></button>
        </form>
        <div style="margin-top: 1.5rem;">
            <p>¿Ya tienes cuenta? <a href="{{ url_for('login') }}" style="color: var(--color-primary); font-weight: 600;">Inicia sesión</a></p>
        </div>
    </div>

</body>
</html>
