<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoecosof - Admin Dashboard</title>
    
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <style>
        :root {
            --primary-green: #20b72c;
            --dark-green: #147a1d;
            --gradient-green: linear-gradient(135deg, #20b72c 0%, #158a20 100%);
            --accent-orange: #f39c12;
            --accent-green: #27ae60;
            --text-dark: #2c3e50;
            --text-light: #7f8c8d;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 15px 35px rgba(0, 0, 0, 0.12);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Mantenemos el fondo de bosque y aplicamos estilos para que se vea premium */
            background-image: url('/static/img/fondo.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
        }

        /* ================= HEADER Y BARRA DE NAVEGACIÓN ================= */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            width: 45px;
            height: auto;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark-green);
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2.5rem;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            font-size: 1.05rem;
            position: relative;
            padding: 0.5rem 0;
            transition: var(--transition);
        }

        /* Micro-interacción sutil en enlaces */
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-green);
            transition: var(--transition);
            border-radius: 2px;
        }

        .nav-link:hover {
            color: var(--primary-green);
        }

        .nav-link:hover::after, .nav-link.active::after {
            width: 100%;
        }
        
        .nav-link.active {
            color: var(--primary-green);
        }

        /* Botón 'Salir' Premium */
        .btn-logout {
            background: var(--gradient-green);
            color: white;
            text-decoration: none;
            padding: 0.7rem 1.8rem;
            border-radius: 50px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(32, 183, 44, 0.3);
            transition: var(--transition);
            border: 1px solid rgba(255,255,255,0.2);
            letter-spacing: 0.3px;
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(32, 183, 44, 0.4);
            background: linear-gradient(135deg, #25cc31 0%, #189e24 100%);
        }

        .btn-logout i {
            font-size: 1.3rem;
        }

        /* ================= MAIN CONTENT ================= */
        .dashboard-container {
            flex: 1;
            padding: 4rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* ================= SECCIÓN DE TÍTULO PRINCIPAL ================= */
        .page-header {
            background: rgba(20, 122, 29, 0.9);
            backdrop-filter: blur(8px);
            padding: 2.5rem 3.5rem;
            border-radius: 20px;
            color: white;
            margin-bottom: 3rem;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .page-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .page-subtitle {
            font-size: 1.1rem;
            font-weight: 300;
            opacity: 0.9;
        }

        /* ================= PANELES DE ESTADÍSTICAS ================= */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
        }

        .stat-card {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            cursor: default;
        }

        /* Barra superior indicadora de color al hover */
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: var(--primary-green);
            opacity: 0;
            transition: var(--transition);
        }
        
        .stat-card.total::before { background: var(--text-dark); }
        .stat-card.review::before { background: var(--accent-orange); }
        .stat-card.solved::before { background: var(--accent-green); }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }
        
        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            flex-shrink: 0;
            background: transparent;
        }

        .stat-card.total .stat-icon { color: #3b82f6; }
        .stat-card.review .stat-icon { color: var(--accent-orange); }
        .stat-card.solved .stat-icon { color: var(--accent-green); }

        .stat-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1;
            color: var(--primary-green);
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .stat-label {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-dark);
            letter-spacing: 0px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2.5rem;
            margin-top: 2.5rem;
        }
        
        .chart-card {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .chart-card h3 {
            color: var(--primary-green);
            margin-bottom: 1.5rem;
            font-weight: 600;
            font-size: 1.3rem;
        }
        
        .chart-container {
            width: 100%;
            height: 300px;
            position: relative;
        }

    </style>
</head>
<body>

    <!-- ================= HEADER / NAVBAR ================= -->
    <nav class="navbar">
        <a href="/" class="logo-container">
            <img src="/static/img/logo.png" alt="Geoecosof" class="logo-img">
            <span class="logo-text">Geoecosof</span>
        </a>
        <div class="nav-links">
            <a href="/" class="nav-link">Inicio</a>
            <a href="/admin/dashboard" class="nav-link active">Admin</a>
            <a href="/logout" class="btn-logout">
                <i class='bx bx-door-open'></i> Salir
            </a>
        </div>
    </nav>

    <!-- ================= DASHBOARD CONTENT ================= -->
    <main class="dashboard-container">
        
        <!-- Paneles de Estadísticas -->
        <div class="stats-grid">
            
            <!-- Panel: Total de reportes -->
            <div class="stat-card total">
                <div class="stat-icon">
                    <i class='bx bx-list-ul'></i>
                </div>
                <div class="stat-content">
                    <span class="stat-value" id="admin-stat-total">0</span>
                    <span class="stat-label">Total de reportes</span>
                </div>
            </div>

            <!-- Panel: En seguimiento -->
            <div class="stat-card review">
                <div class="stat-icon">
                    <i class='bx bx-time-five'></i>
                </div>
                <div class="stat-content">
                    <span class="stat-value" id="admin-stat-tracking">0</span>
                    <span class="stat-label">En seguimiento</span>
                </div>
            </div>

            <!-- Panel: Solucionados -->
            <div class="stat-card solved">
                <div class="stat-icon">
                    <i class='bx bx-check-circle'></i>
                </div>
                <div class="stat-content">
                    <span class="stat-value" id="admin-stat-solved">0</span>
                    <span class="stat-label">Solucionados</span>
                </div>
            </div>

        </div>
        
        <!-- Gráficas -->
        <div class="charts-grid">
            <div class="chart-card">
                <h3>Reportes por tipo</h3>
                <div class="chart-container">
                    <canvas id="adminTypeChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h3>Estado de reportes</h3>
                <div class="chart-container">
                    <canvas id="adminStatusChart"></canvas>
                </div>
            </div>
        </div>

    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            updateAppStats();
        });
    </script>
</body>
</html>
